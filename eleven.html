<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Angular Registration & Login</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 40px;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        h2 {
            color: blue;
        }

    </style>
</head>

<body ng-app="myApp" ng-controller="myController">

    <div class="container">

        <h2>User Registration</h2>

        <input type="text" ng-model="regName" placeholder="Enter Username">

        <input type="password" ng-model="regPass" placeholder="Enter Password">

        <button ng-click="register()">
            Register
        </button>

        <hr>

        <h2>User Login</h2>

        <input type="text" ng-model="loginName" placeholder="Enter Username">

        <input type="password" ng-model="loginPass" placeholder="Enter Password">

        <button ng-click="login()">
            Login
        </button>

        <h3>{{message}}</h3>

    </div>

    <script>

        var app = angular.module("myApp", []);

        app.controller("myController", function($scope) {

            // Store User Data
            $scope.username = "";
            $scope.password = "";

            // Registration Function
            $scope.register = function() {

                $scope.username = $scope.regName;
                $scope.password = $scope.regPass;

                $scope.message = "Registration Successful!";
            };

            // Login Function
            $scope.login = function() {

                if ($scope.loginName == $scope.username &&
                    $scope.loginPass == $scope.password) {

                    $scope.message = "Login Successful!";

                } else {

                    $scope.message = "Invalid Username or Password";
                }
            };

        });

    </script>

</body>
</html>
