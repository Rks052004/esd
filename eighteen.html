<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>jQuery Mobile Demo</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <!-- jQuery Mobile JS -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

</head>
<body>

    <!-- Page -->
    <div data-role="page" id="home">

        <!-- Header -->
        <div data-role="header" data-theme="b">
            <h1>Mobile Web Page</h1>
        </div>

        <!-- Content -->
        <div role="main" class="ui-content">

            <h2>Welcome to jQuery Mobile</h2>

            <p>This is a simple mobile responsive web page.</p>

            <!-- Button -->
            <a href="#about"
               class="ui-btn ui-btn-b ui-corner-all">

               Go to About Page
            </a>

        </div>

        <!-- Footer -->
        <div data-role="footer" data-theme="b">
            <h4>© 2026 jQuery Mobile</h4>
        </div>

    </div>

    <!-- About Page -->
    <div data-role="page" id="about">

        <!-- Header -->
        <div data-role="header" data-theme="b">
            <h1>About Page</h1>
        </div>

        <!-- Content -->
        <div role="main" class="ui-content">

            <p>This page is created using jQuery Mobile.</p>

            <!-- Back Button -->
            <a href="#home"
               class="ui-btn ui-btn-inline ui-btn-b">

               Back to Home
            </a>

        </div>

        <!-- Footer -->
        <div data-role="footer" data-theme="b">
            <h4>Mobile Footer</h4>
        </div>

    </div>

</body>
</html>
