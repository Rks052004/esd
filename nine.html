<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MVC Architecture Demo</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f2f2f2;
        }

        .box {
            background: white;
            padding: 20px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
        }
    </style>
</head>
<body>

    <div class="box">

        <h1>MVC Architecture Example</h1>

        <button onclick="controller.updateView()">
            Show Message
        </button>

        <div id="output"></div>

    </div>

    <script>

        // MODEL
        const model = {
            message: "Hello from Model!"
        };

        // VIEW
        const view = {
            displayMessage: function(msg) {
                document.getElementById("output").innerHTML = msg;
            }
        };

        // CONTROLLER
        const controller = {
            updateView: function() {
                view.displayMessage(model.message);
            }
        };

    </script>

</body>
</html>
