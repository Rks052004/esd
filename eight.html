<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jQuery DOM Manipulation</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f2f2f2;
        }

        .box {
            width: 300px;
            padding: 20px;
            margin: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #text {
            font-size: 20px;
            color: blue;
        }

    </style>
</head>
<body>

    <div class="box">

        <h1>jQuery Demo</h1>

        <p id="text">Hello World!</p>

        <button id="changeBtn">Change Text</button>

        <button id="hideBtn">Hide Text</button>

        <button id="showBtn">Show Text</button>

    </div>

    <script>

        // Change Text
        $("#changeBtn").click(function () {

            $("#text").text("Text Changed using jQuery!");
        });

        // Hide Text
        $("#hideBtn").click(function () {

            $("#text").hide();
        });

        // Show Text
        $("#showBtn").click(function () {

            $("#text").show();
        });

    </script>

</body>
</html>
