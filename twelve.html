<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReactJS Components and Hooks</title>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        // React Component
        function Counter() {

            // useState Hook
            const [count, setCount] = React.useState(0);

            return (
                <div className="box">

                    <h1>ReactJS Hooks Demo</h1>

                    <h2>Count: {count}</h2>

                    <button onClick={() => setCount(count + 1)}>
                        Increment
                    </button>

                </div>
            );
        }

        // Render Component
        ReactDOM.createRoot(document.getElementById("root"))
            .render(<Counter />);

    </script>

</body>
</html>
