<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Basics</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f2f2f2;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
        }
    </style>
</head>
<body>

    <h1>JavaScript Basics</h1>

    <button onclick="showMessage()">
        Click Me
    </button>

    <div id="output"></div>

    <script>

        // Variable
        let name = "Rishit";

        // Function
        function showMessage() {

            // Event action
            document.getElementById("output").innerHTML =
                "Hello " + name + "! Welcome to JavaScript.";
        }

    </script>

</body>
</html>
