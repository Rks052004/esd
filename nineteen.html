<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile First Responsive Design</title>

    <style>

        /* Mobile First Design */

        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px gray;
            text-align: center;
        }

        /* Tablet View */

        @media (min-width: 768px) {

            .container {
                display: flex;
                gap: 20px;
            }

            .card {
                flex: 1;
            }
        }

        /* Desktop View */

        @media (min-width: 1024px) {

            body {
                background: #e6f0ff;
            }

            .card {
                font-size: 20px;
            }
        }

    </style>
</head>
<body>

    <header>
        <h1>Mobile First Responsive Design</h1>
    </header>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Styling and responsiveness</p>
        </div>

        <div class="card">
            <h2>Responsive Design</h2>
            <p>Works on Mobile, Tablet and Desktop</p>
        </div>

    </div>

</body>
</html>
